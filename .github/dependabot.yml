# Keep the dependencies (GitHub Actions, npm, Composer) up to date. Patch and minor bumps are auto-merged
# by .github/workflows/dependabot-auto-merge.yml once CI passes; major bumps are reviewed by hand.
#
# npm is tracked too: @ablogcms/* must match the installed a-blog cms core, so those packages are
# ignored (bumped by hand together with the core; see README "コア更新時の確認事項").
# Composer is tracked for the dev tools; ablogcms/testing-framework follows the a-blog cms minor by
# hand (the CI matrix pins it per a-blog cms version), so it is ignored here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@ablogcms/*"
      # @tiptap/* must stay on the version @ablogcms/block-editor uses. A different version installs a second
      # copy of @tiptap/core and breaks the Editor types, so bump them by hand with @ablogcms/*.
      - dependency-name: "@tiptap/*"
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1). Revisit when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Indirect dependencies are updated too (Dependabot tracks direct ones only by default).
    allow:
      - dependency-type: "all"
    groups:
      # Production dependencies: minor and patch updates only (a major update opens its own PR).
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Development dependencies: major, minor and patch updates are all grouped.
      npm-development:
        dependency-type: "development"
      # Everything else (mainly indirect dependencies, which the groups above do not match): minor and patch only.
      npm-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "ablogcms/testing-framework"
    # Indirect dependencies are updated too (Dependabot tracks direct ones only by default).
    allow:
      - dependency-type: "all"
    groups:
      # Production dependencies: minor and patch updates only (a major update opens its own PR).
      composer-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Development dependencies: major, minor and patch updates are all grouped.
      composer-development:
        dependency-type: "development"
      # Everything else (mainly indirect dependencies, which the groups above do not match): minor and patch only.
      composer-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
