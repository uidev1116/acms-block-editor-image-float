# Keep the GitHub Actions used by the workflows up to date. Patch and minor bumps are auto-merged
# by .github/workflows/dependabot-auto-merge.yml once CI passes; major bumps are reviewed by hand.
#
# npm is tracked too: @ablogcms/* must match the installed a-blog cms core, so those packages are
# ignored (bumped by hand together with the core; see README "コア更新時の確認事項").
# Composer is not tracked: dev tools only, and ablogcms/testing-framework follows a-blog cms by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@ablogcms/*"
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1). Revisit when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
