# Keep the dependencies (GitHub Actions, npm, Composer) up to date. Patch and minor bumps are auto-merged
# by .github/workflows/dependabot-auto-merge.yml once CI passes; major bumps are reviewed by hand.
#
# npm is tracked too: @ablogcms/* must match the installed a-blog cms core, so those packages are
# ignored (bumped by hand together with the core; see README "コア更新時の確認事項").
# Composer is tracked for the dev tools; ablogcms/testing-framework follows the a-blog cms minor by
# hand (the CI matrix pins it per a-blog cms version), so it is ignored here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@ablogcms/*"
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1). Revisit when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "ablogcms/testing-framework"
    groups:
      composer-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
